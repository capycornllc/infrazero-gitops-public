apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-k8s-auth-bootstrap
  namespace: infisical-bootstrap
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: infisical-k8s-auth-bootstrap
    spec:
      serviceAccountName: infisical-k8s-auth-bootstrap
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: alpine:3.19
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -e
          apk add --no-cache bash curl jq coreutils ca-certificates >/dev/null 2>&1
          KUBE_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBE_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          if [ -f /etc/ssl/custom/ca.crt ]; then
            cp /etc/ssl/custom/ca.crt /usr/local/share/ca-certificates/infrazero.crt
            update-ca-certificates 2>/dev/null || true
            export CURL_CA_BUNDLE=/etc/ssl/custom/ca.crt
            export SSL_CERT_FILE=/etc/ssl/custom/ca.crt
          fi
          /bin/bash /scripts/entrypoint.sh
        env:
        - name: INFRAZERO_ENV
          value: test
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: ca-cert
          mountPath: /etc/ssl/custom
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: infisical-k8s-auth-bootstrap
          defaultMode: 0755
      - name: ca-cert
        configMap:
          name: infrazero-ca-cert
          optional: true
